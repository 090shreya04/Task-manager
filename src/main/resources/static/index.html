<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-bs-theme="light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-list-check me-2"></i>Task Manager</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm rounded-circle d-flex align-items-center justify-content-center" id="themeToggleBtn" style="width: 32px; height: 32px;" title="Toggle Dark/Light Mode">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button class="btn btn-light btn-sm text-primary fw-bold" data-bs-toggle="modal" data-bs-target="#taskModal">
                    <i class="fa-solid fa-plus me-1"></i> New Task
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid px-4">
        
        <!-- Filters & Search -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="input-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchInput" placeholder="Search tasks by title or description...">
                </div>
            </div>
            <div class="col-md-6 d-flex gap-2 justify-content-md-end">
                <select class="form-select shadow-sm w-auto" id="filterCategory" style="border-radius: 12px;">
                    <option value="All">All Categories</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
                <select class="form-select shadow-sm w-auto" id="filterPriority" style="border-radius: 12px;">
                    <option value="All">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <div class="row align-items-start kanban-board">
            
            <!-- Column: To Do -->
            <div class="col-md-4 mb-4 kanban-col-wrapper">
                <div class="card shadow-sm border-0 kanban-col" id="col-todo" data-status="todo">
                    <div class="card-header card-header-styled border-0 py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-secondary"><i class="fa-solid fa-circle-dot text-danger me-2"></i>To Do</h5>
                        <span class="badge bg-secondary rounded-pill" id="count-todo">0</span>
                    </div>
                    <div class="card-body kanban-body custom-scrollbar" id="todo-tasks">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Column: In Progress -->
            <div class="col-md-4 mb-4 kanban-col-wrapper">
                <div class="card shadow-sm border-0 kanban-col" id="col-in-progress" data-status="in-progress">
                    <div class="card-header card-header-styled border-0 py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-secondary"><i class="fa-solid fa-spinner fa-spin text-warning me-2"></i>In Progress</h5>
                        <span class="badge bg-secondary rounded-pill" id="count-in-progress">0</span>
                    </div>
                    <div class="card-body kanban-body custom-scrollbar" id="in-progress-tasks">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Column: Done -->
            <div class="col-md-4 mb-4 kanban-col-wrapper">
                <div class="card shadow-sm border-0 kanban-col" id="col-done" data-status="done">
                    <div class="card-header card-header-styled border-0 py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-secondary"><i class="fa-solid fa-circle-check text-success me-2"></i>Done</h5>
                        <span class="badge bg-secondary rounded-pill" id="count-done">0</span>
                    </div>
                    <div class="card-body kanban-body custom-scrollbar" id="done-tasks">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold" id="taskModalLabel">Add New Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="taskFrom">
                    <div class="modal-body">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="taskTitle" required placeholder="e.g. Redesign Landing Page">
                        </div>
                        <div class="mb-3">
                            <label for="taskDesc" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="taskDesc" rows="3" placeholder="Add some details..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="taskCategory" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                <select class="form-select" id="taskCategory" required>
                                    <option value="Work">Work</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Study">Study</option>
                                    <option value="Health">Health</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="taskPriority" class="form-label fw-semibold">Priority <span class="text-danger">*</span></label>
                                <select class="form-select" id="taskPriority" required>
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskDueDate" class="form-label fw-semibold">Due Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="taskDueDate" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4" id="saveTaskBtn">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
